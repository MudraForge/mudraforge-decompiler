<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MudraForge Training Visualizer</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --card: #18181b;
      --background: #09090b;
      --foreground: #f4f4f5;
      --border: #27272a;
      --muted-foreground: #a1a1aa;
      --primary: #10b981;
      --primary-foreground: #ffffff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --card: #ffffff;
        --background: #f8fafc;
        --foreground: #0f172a;
        --border: #e2e8f0;
        --muted-foreground: #64748b;
        --primary: #059669;
        --primary-foreground: #ffffff;
      }
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-3.5 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
      <div class="flex items-center gap-2">
        <h2 class="text-sm font-semibold leading-tight">Training Runs &amp; Live Progress</h2>
        <span id="liveBadge" class="hidden px-2 py-0.5 rounded-full text-xs font-semibold bg-[#10b981]/20 text-[#10b981]">LIVE</span>
      </div>
      <div class="flex flex-wrap items-center gap-1.5 text-xs">
        <button onclick="window.location.reload()" title="Reload latest logs (or press F5)" class="px-2 py-1 rounded-md border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--border)] text-[var(--foreground)] text-xs transition">
          Refresh
        </button>
        <select id="presetSel" class="px-2 py-1 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] text-xs">
          <option value="RECENT_VS">Recent Dual vs Single</option>
          <option value="TOP_3">Top 3 Best</option>
          <option value="TOP_2">Top 2 Best</option>
          <option value="TOP_5">Top 5 Best</option>
          <option value="ALL">Show All in Family</option>
        </select>
        <select id="rankSel" class="px-2 py-1 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] text-xs">
          <option value="composite">Rank: Composite</option>
          <option value="bestEm">Rank: Primary Score</option>
          <option value="bestNll">Rank: Lowest Loss</option>
          <option value="mtime">Rank: Most Recent</option>
        </select>
        <span id="stampText" class="text-xs text-[var(--muted-foreground)]">2026-11-11 04:33:27</span>
      </div>
    </div>

    <!-- Top-Level Model Family Switcher (Supervised vs Reinforcement Learning) -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2 pb-2 border-b border-[var(--border)]">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-semibold text-[var(--muted-foreground)] mr-1">Family:</span>
        <button id="familyBtnSup" onclick="switchFamily('SUP')" class="px-3 py-1 rounded-md text-xs font-semibold transition">
          Supervised (<span id="supCount">0</span>)
        </button>
        <button id="familyBtnRl" onclick="switchFamily('RL')" class="px-3 py-1 rounded-md text-xs font-semibold transition">
          Reinforcement Learning (GRPO) (<span id="rlCount">0</span>)
        </button>
      </div>
      <div class="text-xs text-[var(--muted-foreground)]">
        <span id="familySummary"></span>
      </div>
    </div>

    <div id="metricTabs" class="flex flex-wrap gap-1.5 mb-2"></div>
    <div id="visBar" class="flex flex-wrap gap-1.5 mb-2 "></div>

    <div class="relative w-full">
      <svg id="chart" viewBox="0 0 740 290" class="w-full h-auto block select-none"></svg>
    </div>

    <div class="mt-2 pt-2 border-t border-[var(--border)] flex flex-wrap items-center justify-between gap-2 text-xs">
      <span id="hoverReadout" class="font-medium">Hover over any epoch to compare visible runs.</span>
      <span id="metricHint" class="text-[var(--muted-foreground)]">Click a run chip above to toggle visibility.</span>
    </div>
    
    <div class="mt-4 overflow-x-auto border-t border-[var(--border)] pt-3">
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr class="text-[var(--muted-foreground)] border-b border-[var(--border)]">
            <th class="py-1.5 pr-3">Vis</th>
            <th class="py-1.5 pr-3">Run</th>
            <th class="py-1.5 pr-3">Status</th>
            <th class="py-1.5 pr-3">Epochs</th>
            <th class="py-1.5 pr-3">Best Ep</th>
            <th class="py-1.5 pr-3">Primary Score</th>
            <th class="py-1.5 pr-3">Composite</th>
            <th class="py-1.5">Updated</th>
          </tr>
        </thead>
        <tbody id="runTableBody"></tbody>
      </table>
    </div>
    
  </div>

        const chip = document.createElement("button");
        chip.className = "inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-xs border transition " +
          (on ? "border-[var(--foreground)]/40 bg-[var(--secondary)]/60 text-[var(--foreground)]" : "border-[var(--border)] text-[var(--muted-foreground)] opacity-55");
        const liveDot = r.isLive ? " [LIVE " + r.completedEpochs + "/" + r.totalEpochs + "]" : "";
        chip.innerHTML = `<span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${r.color}"></span>` +
          `<span>#${idx + 1} ${r.titleHint} (${r.id})${liveDot}</span>`;
        chip.title = `${r.summary.primaryLabel} | Click to toggle visibility`;
        chip.onclick = () => {
          if (visibleSet.has(r.id)) visibleSet.delete(r.id);
          else visibleSet.add(r.id);
          renderAll();
        };
        visBar.appendChild(chip);
      });

      renderChart(famRuns, metricsList.find((m) => m.key === activeMetric) || metricsList[0]);
      renderTable();
    }

    function renderChart(famRuns, m) {
      const isLight = document.documentElement.classList.contains("light");
      const gridCol = isLight ? "rgba(0,0,0,0.10)" : "rgba(255,255,255,0.12)";
      const axisCol = isLight ? "#52525b" : "#a1a1aa";
      const W = 740, H = 290;
      const padL = 48, padR = 16, padT = 14, padB = 26;
      const plotW = W - padL - padR, plotH = H - padT - padB;

      const shown = famRuns.filter((r) => visibleSet.has(r.id));
      const allVals = [];
      let maxEp = 1;
      shown.forEach((r) => {
        r.epochs.forEach((ep) => {
          if (ep.e > maxEp) maxEp = ep.e;
          if (typeof ep[m.key] === "number") allVals.push(ep[m.key]);
        });
      });
      maxEp = Math.max(maxEp, activeFamily === "RL" ? 5 : 14);
      const yMin = allVals.length ? Math.min(m.min, Math.floor((Math.min(...allVals) - (m.max - m.min) * 0.05) * 100) / 100) : m.min;
      const yMax = allVals.length ? Math.max(m.max, Math.ceil((Math.max(...allVals) + (m.max - m.min) * 0.05) * 100) / 100) : m.max;

      const xPos = (e) => padL + ((e - 1) / Math.max(1, maxEp - 1)) * plotW;
      const yPos = (v) => padT + (1 - Math.max(0, Math.min(1, (v - yMin) / Math.max(1e-6, yMax - yMin)))) * plotH;

      let out = "";
      for (let i = 0; i <= 4; i++) {
        const v = yMin + ((yMax - yMin) * i) / 4;
        const y = yPos(v);
        out += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${gridCol}" stroke-width="1"/>`;
        const lbl = m.unit ? v.toFixed(0) + "%" : v.toFixed(2);
        out += `<text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-size="12" fill="${axisCol}">${lbl}</text>`;
      }
      for (let e = 1; e <= maxEp; e++) {
        const x = xPos(e);
        out += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H - padB}" stroke="${gridCol}" stroke-width="0.6" stroke-dasharray="2,3"/>`;
        out += `<text x="${x}" y="${H - 7}" text-anchor="middle" font-size="12" fill="${axisCol}">E${e}</text>`;
      }

      shown.forEach((r) => {
        const pts = r.epochs.filter((ep) => typeof ep[m.key] === "number");
        if (!pts.length) return;
        const path = pts.map((ep, i) => `${i === 0 ? "M" : "L"}${xPos(ep.e).toFixed(1)},${yPos(ep[m.key]).toFixed(1)}`).join(" ");
        const dash = r.isLive ? ` stroke-dasharray="6,3"` : "";
        out += `<path d="${path}" fill="none" stroke="${r.color}" stroke-width="2.4" stroke-linecap="round"${dash}/>`;
        pts.forEach((ep) => {
          const rad = ep.e === r.summary.bestEpoch ? 5.2 : 3.4;
          const stroke = ep.e === r.summary.bestEpoch ? ` stroke="currentColor" stroke-width="1.2"` : "";
          out += `<circle cx="${xPos(ep.e)}" cy="${yPos(ep[m.key])}" r="${rad}" fill="${r.color}"${stroke}/>`;
        });
      });

      const colW = plotW / Math.max(1, maxEp - 1);
      for (let e = 1; e <= maxEp; e++) {
        out += `<rect x="${xPos(e) - colW / 2}" y="${padT}" width="${colW}" height="${plotH}" fill="transparent" data-ep="${e}" class="cursor-pointer"/>`;
      }

      svgEl.innerHTML = out;
      metricHint.textContent = m.hint;
      showEpochReadout(Math.min(maxEp, Math.max(1, ...shown.map((r) => r.completedEpochs), 1)), shown, m);
      svgEl.querySelectorAll("rect[data-ep]").forEach((el) => {
        el.addEventListener("mouseenter", () => showEpochReadout(Number(el.getAttribute("data-ep")), shown, m));
      });
    }

    function showEpochReadout(epNum, shown, m) {
      if (!shown.length) {
        hoverReadout.textContent = "No runs selected. Toggle a run chip above.";
        return;
      }
      const parts = [];
      shown.forEach((r) => {
        const row = r.epochs.find((x) => x.e === epNum);
        if (row && typeof row[m.key] === "number") {
          const v = m.unit ? row[m.key].toFixed(2) + "%" : row[m.key].toFixed(4);
          parts.push(`${r.id}=${v}`);
        }
      });
      hoverReadout.textContent = `E${String(epNum).padStart(2, "0")}: ` + (parts.length ? parts.join(" | ") : "No data at this epoch");
    }

    function renderTable() {
      const tbody = document.getElementById("runTableBody");
      if (!tbody) return;
      const list = [...RUNS].filter((r) => r.family === activeFamily).sort((a, b) => scoreForRank(b, rankBy) - scoreForRank(a, rankBy));
      tbody.innerHTML = list.map((r) => {
        const on = visibleSet.has(r.id);
        const st = r.isLive ? `<span class="text-[#10b981] font-semibold">LIVE</span>` : "DONE";
        return `<tr class="border-b border-[var(--border)]/50">` +
          `<td class="py-1.5 pr-3"><input type="checkbox" data-runid="${r.id}" ${on ? "checked" : ""}/></td>` +
          `<td class="py-1.5 pr-3"><span class="inline-block w-2.5 h-2.5 rounded-full mr-1.5" style="background:${r.color}"></span>${r.titleHint} (${r.id})</td>` +
          `<td class="py-1.5 pr-3">${st}</td>` +
          `<td class="py-1.5 pr-3">${r.completedEpochs}/${r.totalEpochs}</td>` +
          `<td class="py-1.5 pr-3">E${r.summary.bestEpoch}</td>` +
          `<td class="py-1.5 pr-3">${r.summary.primaryLabel}</td>` +
          `<td class="py-1.5 pr-3">${r.summary.composite.toFixed(2)}</td>` +
          `<td class="py-1.5 text-[var(--muted-foreground)]">${r.mtimeIso}</td>` +
          `</tr>`;
      }).join("");
      tbody.querySelectorAll("input[data-runid]").forEach((cb) => {
        cb.onchange = () => {
          const id = cb.getAttribute("data-runid");
          if (cb.checked) visibleSet.add(id); else visibleSet.delete(id);
          renderAll();
        };
      });
    }

    function updateRuns(fresh) {
      RUNS = fresh;
      document.getElementById("stampText").textContent = new Date().toLocaleTimeString();
      applyPreset(true);
      renderAll();
    }

    presetSel.onchange = () => { presetMode = presetSel.value; applyPreset(false); renderAll(); };
    rankSel.onchange = () => { rankBy = rankSel.value; applyPreset(false); renderAll(); };

    applyPreset(false);
    renderAll();
    
  </script>
</body>
</html>
