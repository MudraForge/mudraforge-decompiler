    <text x="20" y="24" font-size="12.5" font-weight="800" fill="#9f1239">The 44.4% Arithmetic Ceiling of Pure LLMs</text>
    <text x="20" y="44" font-size="11" font-weight="500" fill="#be123c">Even frontier models (GPT-5.2, Claude Sonnet 4.5, Qwen-480B) peak at 44.4% directly</text>
