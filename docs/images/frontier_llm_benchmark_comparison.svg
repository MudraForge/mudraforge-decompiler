    <text x="560" y="60" font-size="11" font-weight="500" fill="#15803d">compiles text into a Declarative AST; the USVM executes exact BigInt integer math.</text>
    <text x="560" y="76" font-size="11" font-weight="700" fill="#047857">Result: 100% zero-shot accuracy (35/35 PASS) with audit-grade determinism.</text>
