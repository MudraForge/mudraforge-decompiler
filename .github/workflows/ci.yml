name: CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'refactor/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Catala Interpreter
        uses: actions/cache@v4
        with:
          path: scripts/catala_interpreter.cjs
          key: catala-${{ hashFiles('tools/catala.lock.json') }}

      - name: Install Python Dependencies & Package
        run: |
            python -m pip install --upgrade pip
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install -r requirements.txt
            pip install -e .

      - name: Install Node.js Dependencies
        run: npm install

      - name: Fetch and Verify Catala Interpreter
        run: |
          node scripts/fetch_catala_interpreter.mjs
          node scripts/fetch_catala_interpreter.mjs --check

      - name: Static Security & Rule 20 Zero-Emoji Audit
        run: python scripts/security_audit.py

      - name: Verify Training Pipeline (Smoke Test)
        run: python train.py --smoke-test

      - name: Run Unit Tests
        env:
          REQUIRE_CATALA: "1"
        run: python -m unittest discover tests -v

      - name: Run Cross-Domain Regulatory Benchmark
        run: python benchmarks/test_crossdomain_deonticbench.py
